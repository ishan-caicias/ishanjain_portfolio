name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      # Mechanical documentation-drift gate (engine-default contradictions,
      # ADR status vs index, TR index completeness, broken links in
      # current-state docs). Added as a STEP in this existing job, not a new
      # job, so the branch-protection ruleset's required status-check names
      # stay valid (TR-034).
      - run: npm run docs:check
      # PF-10 C4: generated-asset integrity gate. `resources/` is gitignored, so CI can
      # NEVER regenerate these assets — the committed bytes under public/assets are the
      # deliverable. This asserts the committed bytes still match what the pipelines say
      # they produce (every declared body/tier/map present, manifests consistent, no
      # orphans), which is the only half of reproducibility CI can actually check.
      # Source-free and fast, so it lives as a STEP in this existing job rather than a new
      # one — keeping the branch-protection ruleset's required status-check names valid
      # (TR-034), the same reason docs:check was added here.
      - run: npm run assets:verify
      # Asset weight, gated for the first time (PF-10 C4). public/assets grew to 209 MB
      # across PF-10 with nothing watching it. Runs here rather than in the build job
      # because it reads public/ directly and needs no dist/.
      - run: npm run budget:check:assets

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # PF-09 B6: bundle-budget gate — total JS, largest chunk (the TR-027
      # barrel-import canary), and WASM payload against recorded ceilings.
      - run: npm run budget:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Sharded across 4 runners (2026-07-25 E2E audit, TR-104): each shard is its own VM with its
  # own single SwiftShader instance, so this does NOT reproduce the "N workers time-slicing ONE
  # GPU" flake that workers:1 (playwright.config.ts, TR-018/TR-052) exists to prevent — that
  # problem is about local multi-worker contention on ONE machine, and shards share no GPU.
  # `workers: 1` stays in effect INSIDE each shard via playwright.config.ts, unchanged.
  e2e:
    name: E2E Tests (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Aggregator so branch-protection can keep requiring a single, stable status-check name
  # ("E2E Tests") instead of the four per-shard names above, which would otherwise break any
  # existing required-check rule the moment this job became a matrix (same reasoning as
  # docs:check/assets:verify living as steps rather than jobs above — TR-034).
  e2e-summary:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - name: Check shard results
        run: |
          if [ "${{ needs.e2e.result }}" != "success" ]; then
            echo "One or more E2E shards failed or were cancelled."
            exit 1
          fi
