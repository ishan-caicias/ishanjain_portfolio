name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# Least-privilege default (2026-07-29 CI/CD audit): none of these jobs push commits, comment
# on PRs, or touch any other repo resource — read-only checkout is all any of them need. Left
# unset, the workflow token defaults to the repo's (potentially broader) default permission
# setting; declaring it here means a future job that DOES need write access has to say so
# explicitly at the job level, rather than silently inheriting whatever the repo default happens
# to be.
permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      # Git LFS with caching (TR-105). Every *.png/*.glb/*.jpg/*.jpeg/*.webp/*.obj is
      # Git-LFS-tracked (.gitattributes); a default checkout gets ~133-byte pointer stubs, not
      # real bytes. Without real bytes the two asset gates below (assets:verify,
      # budget:check:assets) pass VACUOUSLY (a 133-byte "image" is trivially under budget) — the
      # same root cause that made every full-scene E2E test fail in CI on PR #6. We fetch LFS
      # explicitly AFTER restoring a cache of .git/lfs keyed on the set of LFS object ids, so the
      # ~281 MB pull only happens when the assets actually change (GitHub free LFS bandwidth is
      # 1 GB/month). Because `build` runs after `lint` (needs:) and shares this key, build
      # normally restores the cache lint just saved and pulls ~nothing. SAFETY: `git lfs pull`
      # always reconciles against the pointers, so a cache miss or a stale/wrong key just means a
      # full pull — never broken or partial assets. (This caching mechanism is only fully
      # provable on a real CI run; its worst case is "no bandwidth saved", not a broken build.)
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Compute LFS cache key
        id: lfskey
        run: echo "k=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ steps.lfskey.outputs.k }}
          restore-keys: ${{ runner.os }}-lfs-
      - run: git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      # Mechanical documentation-drift gate (engine-default contradictions,
      # ADR status vs index, TR index completeness, broken links in
      # current-state docs). Added as a STEP in this existing job, not a new
      # job, so the branch-protection ruleset's required status-check names
      # stay valid (TR-034).
      - run: npm run docs:check
      # PF-10 C4: generated-asset integrity gate. `resources/` is gitignored, so CI can
      # NEVER regenerate these assets — the committed bytes under public/assets are the
      # deliverable. This asserts the committed bytes still match what the pipelines say
      # they produce (every declared body/tier/map present, manifests consistent, no
      # orphans), which is the only half of reproducibility CI can actually check.
      # Source-free and fast, so it lives as a STEP in this existing job rather than a new
      # one — keeping the branch-protection ruleset's required status-check names valid
      # (TR-034), the same reason docs:check was added here.
      - run: npm run assets:verify
      # Asset weight, gated for the first time (PF-10 C4). public/assets grew to 209 MB
      # across PF-10 with nothing watching it. Runs here rather than in the build job
      # because it reads public/ directly and needs no dist/.
      - run: npm run budget:check:assets

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro check

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      # Git LFS with caching (TR-105/TR-111 pattern — required here too, found broken live on
      # PR #6 2026-07-29): PF-11 D9.3 added tests (render-layers.test.ts) that statSync() real
      # files under public/assets to cross-check budgets.config.mjs's layerBytes against actual
      # on-disk sizes. This job's checkout previously had no `git lfs pull`, so every *.png
      # under public/assets was its ~132-byte LFS pointer stub, not real bytes — the exact
      # "vacuous pass / spurious fail" class TR-105 already fixed for the asset-verify and
      # budget:check gates, just newly reached by a unit test instead. Same cache-keyed pattern
      # as every other job here; SAFETY note there applies unchanged.
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Compute LFS cache key
        id: lfskey
        run: echo "k=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ steps.lfskey.outputs.k }}
          restore-keys: ${{ runner.os }}-lfs-
      - run: git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test]
    steps:
      # Git LFS with caching (TR-105) — REQUIRED here: `astro build` copies public/assets verbatim
      # into dist/, and the e2e shards run against THIS dist/ via the uploaded artifact, so a
      # build from LFS pointer stubs ships a ~2.8 MB dist of text stubs (measured on PR #6) and
      # every full-scene E2E test fails (star-catalog decode → "procedural", ship GLB parse →
      # shipState "failed", planet textures blank). Same cache pattern + SAFETY note as the lint
      # job above; because this job `needs: [lint, ...]`, it normally restores the LFS cache lint
      # just saved (same key) and `git lfs pull` fetches ~nothing.
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Compute LFS cache key
        id: lfskey
        run: echo "k=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ steps.lfskey.outputs.k }}
          restore-keys: ${{ runner.os }}-lfs-
      - run: git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # PF-09 B6: bundle-budget gate — total JS, largest chunk (the TR-027
      # barrel-import canary), and WASM payload against recorded ceilings.
      - run: npm run budget:check
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # CI SMOKE SUBSET, not the full suite (TR-106 decision, 2026-07-25). Background: the 4-shard
  # full-150-test matrix (TR-104) was verified for the first time on 2026-07-25 (run 30156141504,
  # after the TR-105 Git-LFS fix made the build correct) and came back 13 REAL failures across 6
  # files — ascent, camera-zoom, craft-ship, d64-owner-bugfixes, engine-select, frame-ladder —
  # every one a timeout/margin miss (d64:254 literally exceeded its 150s test timeout mid-arrival)
  # on GitHub's free 2-core runners software-rendering this scene's real travel sequences. A scan
  # of the last 20 CI runs found E2E had failed on EVERY ONE going back weeks — this was never a
  # regression from sharding or from this session's changes, it's a standing hardware ceiling:
  # this site's heavy scenes need more compute than a free Actions runner gives, and the owner's
  # actual E2E gate has always been the local machine (16-core/50GB, 150/150 clean at workers=1,
  # 48.4 min — see TR-105). Rather than keep chasing a full-suite CI number this hardware cannot
  # produce, CI now runs a curated SMOKE SUBSET: every file that had ZERO failures in that same
  # real run (accessibility, craft-assets, page-load-console, navigation, perf-budgets,
  # webgpu-hardware [fails open/skips, near-zero cost], funnel, planet-pixels) plus load-progress
  # (its 2 failures were the LFS-in-e2e-checkout gap below, not a hardware ceiling — fixed here).
  # ~39 of 150 tests. No sharding needed at this size — the matrix + aggregator this replaced
  # existed only to fit the full suite in CI's timeout; that problem doesn't exist for 39 tests.
  # The full 150 remain the required local pre-push gate (CLAUDE.md #25); this job is a fast
  # correctness canary (would have caught the exact LFS-pointer-stub class of defect TR-105
  # fixed) — see docs/cicd/2026-07-25-e2e-ci-smoke-subset.md for the full decision record.
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Same LFS+cache pattern as lint/build (TR-105) — REQUIRED here too: load-progress.spec.ts
      # fs-reads public/assets/*.png and the craft GLB from THIS job's own checkout (not the
      # downloaded dist/ artifact) to cross-check the live page's reported byte counts against
      # disk. A default (non-LFS) checkout gave it pointer-stub sizes while the served page (built
      # from the LFS-fixed `build` job) reported real bytes — a mismatch that isn't a hardware
      # ceiling, just this job's checkout missing the same fix. No other file in the smoke set
      # does a direct fs read (grepped for fs.readFileSync/statSync/sizeOf across all 9 files).
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Compute LFS cache key
        id: lfskey
        run: echo "k=$(git lfs ls-files --long | cut -d ' ' -f1 | sort | sha256sum | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore LFS object cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ steps.lfskey.outputs.k }}
          restore-keys: ${{ runner.os }}-lfs-
      - run: git lfs pull
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: |
          npx playwright test \
            tests/e2e/accessibility.spec.ts \
            tests/e2e/craft-assets.spec.ts \
            tests/e2e/page-load-console.spec.ts \
            tests/e2e/navigation.spec.ts \
            tests/e2e/perf-budgets.spec.ts \
            tests/e2e/webgpu-hardware.spec.ts \
            tests/e2e/funnel.spec.ts \
            tests/e2e/planet-pixels.spec.ts \
            tests/e2e/load-progress.spec.ts
