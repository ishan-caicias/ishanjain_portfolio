version: 2
updates:
  # npm dependencies (package.json). Weekly, not daily — this is a solo-maintained repo and a
  # PR every day would just sit unreviewed; weekly keeps the queue small enough to actually
  # triage. Grouped so a routine patch/minor bump across many packages is one PR to review,
  # not a dozen — major bumps stay separate since those are the ones that actually need
  # reading (TypeScript in particular is pinned ~6.0.3 per ADR-0001; a major-version PR here
  # is a deliberate decision, not an auto-mergeable patch).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      patch-and-minor:
        update-types: ["patch", "minor"]
    ignore:
      # TypeScript 7 is a deliberate, tracked deferral (ADR-0001) — breaks astro check and
      # typed lint. Dependabot must not propose it as a routine bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions pinned in ci.yml (actions/checkout, setup-node, cache,
  # upload/download-artifact). Same weekly cadence, own group — an Actions bump is a different
  # kind of change (pipeline behavior, not app dependencies) and shouldn't be lumped with npm.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
